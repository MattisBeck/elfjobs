[project]
name = "elfjobs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "icalendar>=7.3.2",
    "psycopg[binary]>=3.3.9",
    "pypdf>=7.2.0",
]

[dependency-groups]
dev = [
    "faker>=40.63.0",
    "fpdf2>=2.9.0",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
