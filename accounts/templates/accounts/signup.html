{% extends "base.html" %}
{% load static %}

{% block title %}Registrieren · elfjobs{% endblock %}

{% block content %}
<section class="form-page">
  <img class="form-logo" src="{% static 'img/elfjobs-logo.svg' %}" alt="elfjobs">
  <h1>Registrieren</h1>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit" class="button button-primary">Konto anlegen</button>
  </form>
  <p class="muted">Schon ein Konto? <a href="{% url 'login' %}">Anmelden</a></p>
</section>
{% endblock %}
