{% extends "base.html" %}
{% load static %}

{% block title %}Anmelden · elfjobs{% endblock %}

{% block content %}
<section class="form-page">
  <img class="form-logo" src="{% static 'img/elfjobs-logo.svg' %}" alt="elfjobs">
  <h1>Anmelden</h1>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_div }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="button button-primary">Anmelden</button>
  </form>
  <p class="muted">Noch kein Konto? <a href="{% url 'signup' %}">Registrieren</a></p>
  <p class="muted">Bestätigungsmail nicht bekommen? <a href="{% url 'confirm_pending' %}">Neu senden</a></p>
  <p class="muted">Ihr sucht Studierende? <a href="{% url 'company_login' %}">Firmen-Login</a></p>
</section>
{% endblock %}
