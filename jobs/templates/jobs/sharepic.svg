<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">{# Sharepic (#37). Alle Texte laufen durch Autoescape, Titel und Firma kommen aus der Datenbank. #}
  <title>{{ posting.title }} · {{ posting.company.name }} · elfjobs</title>
  <style>text { font-family: Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums; }</style>
  <rect width="1080" height="1080" fill="#FFFFFF"/>
  <rect width="1080" height="16" fill="#2F5BD8"/>
  <text x="96" y="150" font-size="56" font-weight="700" fill="#1B1E25">elf<tspan fill="#2F5BD8">jobs</tspan></text>
  <text x="96" y="250" font-size="34" font-weight="500" fill="#646B78">{{ posting.get_kind_display }} · {{ posting.get_workplace_display }}</text>
  <text font-size="68" font-weight="700" fill="#1B1E25">{% for line, y in title_lines %}<tspan x="96" y="{{ y }}">{{ line }}</tspan>{% endfor %}</text>
  <text x="96" y="{{ company_y }}" font-size="40" font-weight="500" fill="#3B404B">{{ posting.company.name|truncatechars:36 }}</text>
  <rect x="96" y="700" width="600" height="200" rx="24" fill="#F3F6FE"/>
  <text x="136" y="805" font-size="96" font-weight="700" fill="#2A4FBF">{{ posting.hourly_wage }} €</text>
  <text x="136" y="862" font-size="34" font-weight="500" fill="#3B404B">brutto pro Stunde · {{ posting.hours_per_week }} h pro Woche</text>
  <text x="96" y="1010" font-size="30" fill="#646B78">Jobs neben dem Studium auf elfjobs</text>
